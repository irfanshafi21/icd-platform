[client]
toolbarMode = "minimal"
showErrorDetails = "full"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[theme]
base = "light"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 16
baseFontWeight = 400
headingFontWeights = [700, 700, 600, 600, 600, 600]
