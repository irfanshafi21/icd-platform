name: Apply screening latency patch

on:
  push:
    branches:
      - optimize-screening-latency
    paths:
      - scripts/apply_latency_patch.py
      - .github/workflows/apply-latency-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-screening-latency
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_latency_patch.py
      - name: Validate Python syntax
        run: python -m py_compile ai_engine.py
      - name: Commit patched engine
        run: |
          if git diff --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_engine.py
          git commit -m "Reduce AI screening retry latency"
          git push origin optimize-screening-latency
