name: App quality checks
on:
  pull_request:
  push:
    branches: [optimize-screening-latency]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt httpx
      - run: python -m unittest test_web_app test_backend_workflows -q
      - run: node --check web/app.js && node --check web/service-status.js && node scripts/shortlist-test.cjs && node scripts/device-storage-test.cjs
      - run: npm install --no-save playwright@1.55.0 @electric-sql/pglite@0.5.8
      - run: node scripts/owner-analytics-test.cjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ui-workflow-qa.cjs
        env:
          QA_WIDTHS: '390,1440'
